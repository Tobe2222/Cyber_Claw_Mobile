name: Build Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# v3.8.6: GitHub Actions runner moved to Node.js 24 by
# default on 2026-06-02 (deprecation of Node.js 20).
# The previous v3.8.5 build (tag `v3.8.5`, run #541)
# failed at the `android-actions/setup-android@v3`
# step: the action was last updated Nov 2024 and still
# uses Node.js 20 internally. When GitHub forced it
# to run on Node 24, the action's dependency graph
# broke at the SDK-download step. The maintainer
# released v4.0.1 (Apr 2026) specifically to fix this;
# bumping `@v3` -> `@v4` picks up the Node-24-
# compatible version.
#
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 is a belt-and-
# suspenders env var per GitHub's recommended
# migration path (https://github.blog/changelog/
# 2025-09-19-deprecation-of-node-20-on-github-actions-
# runners/). Any remaining Node-20 actions on the
# runner will be forced to run on Node 24, matching
# the rest of the workflow. Pinned to v4 (latest);
# the @v3 -> @v4 jump is what closes the build break.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-android:
    runs-on: ubuntu-latest
    # v3.2.25: explicit job timeout (30 min). The Android build
    # typically takes 9-12 minutes; a 30-min ceiling gives the
    # retry wrapper + Gradle + APK + upload ample headroom while
    # also explicitly satisfying the GitHub Actions requirement.
    # Without this, GitHub cancels jobs after the default 6-hour
    # ceiling (failure mode Tobe hit on the first retry).
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # v3.2.25: bump to Node 24. Node 20 was deprecated
          # 2025-09-19 and runner defaults to 24 now. Stayed on
          # 22 for compatibility with react-native 0.74 dependencies.
          node-version: '24'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36" 2>&1 | tail -5

      - name: Clean Gradle caches
        run: |
          rm -rf ~/.gradle/wrapper/
          rm -rf ~/.gradle/caches/

      - name: Install dependencies
        run: npm ci

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        # Use github.ref_name (e.g. v3.2.28) so the filename
        # matches the tag. Previously hardcoded to "3.2.27",
        # which meant v3.2.28's release shipped a 3.2.27-named
        # APK. Same flag both here and in the upload step.
        run: mv android/app/build/outputs/apk/release/app-release.apk CyberClaw-Android-${{ github.ref_name }}.apk

      - name: Upload to GitHub Release
        # v3.10.165: replaced the nick-fields/retry@v3 wrapper
        # (which was silently swallowing the upload failure —
        # 4 v3.10.165 runs all reported success but no release
        # was ever created) with softprops/action-gh-release
        # directly. This action is the canonical GitHub-release
        # upload action: it creates-or-updates the release AND
        # attaches the asset in one call, and it fails loud if
        # the upload doesn't succeed. Built-in retry is 3 attempts
        # for transient HTTP errors.
        #
        # draft: false is REQUIRED. softprops defaults to
        # draft: true, which means the release gets created
        # but never surfaces on the public Tags page (drafts
        # are only visible to authenticated users with write
        # access). The download dropdown on the Tags page
        # only lists non-draft release assets. 4 v3.10.165
        # runs silently created draft releases until I
        # noticed and manually published the v3.10.165
        # release via gh release edit --draft=false on
        # 2026-08-12.
        #
        # Note: github.ref_name is already prefixed with "v" (e.g.
        # "v3.10.165"). tag_name uses the ref directly; the
        # display name strips the leading "v" so the release
        # shows as "3.10.165" instead of "v3.10.165" on the
        # Releases page (the Tags page shows tag_name as-is).
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: CyberClaw-Android-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
